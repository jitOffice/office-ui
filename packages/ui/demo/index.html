<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>office-ui</title>
    <style>
      body {
        margin: 0;
        background: var(--oj-bg-page, #fff);
        color: var(--oj-text-1, #151515);
      }

      /* demo 专属：组件只给三档的骨架，这里让 large / small 在真按钮上有肉眼可见的差别。
         small 必须把文字用视觉隐藏而不是 display:none —— 后者会把按钮的无障碍名字一起删掉。 */
      .oj-ribbon-group__item[data-size='large'] .oj-button {
        flex-direction: column;
        height: auto;
        padding: var(--oj-space-1) var(--oj-space-2);
      }

      .oj-ribbon-group__item[data-size='small'] .oj-button__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
