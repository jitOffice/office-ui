<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="office-ui">
  <!-- 站点图标：色值取自 packages/tokens 的 --oj-brand-6 / --oj-brand-3。
       存在的理由有两个：内网部署不能引外部图标 CDN；没有 icon 声明时浏览器会去要
       /favicon.ico，每次访问在控制台留一条 404（真浏览器实测过）。 -->
  <rect width="32" height="32" rx="7" fill="#165DFF"/>
  <circle cx="15" cy="16" r="7.5" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="19" y="19" width="8" height="8" rx="2" fill="#A3BFFF"/>
</svg>
